# Pokémon Colosseum (NTSC-U) — GC6E01 Rev 0
# Decompilation project configuration for decomp-toolkit (dtk)

object_base: orig/GC6E01
object: sys/main.dol
hash: 870e8b9693ca780782d80f22a6a4572d8ba9458f

symbols: config/GC6E01/symbols.txt
splits: config/GC6E01/splits.txt

# Auto-detect objects and strings during initial split
detect_objects: true
detect_strings: true

# Write disassembly for undecompiled functions
write_asm: true

# Fill gaps between objects with alignment symbols
fill_gaps: true

# Export all symbols
export_all: true

# The retail DOL was linked with _db_stack_addr = _stack_addr + 0x8000.
# dtk's default DOL linker script template uses 0x2000, so keep the one
# game-specific linker-script difference in a tracked dtk template override.
ldscript_template: config/GC6E01/ldscript.tpl

# CodeWarrior compiler settings
# Exact version TBD — common GCN versions: 8, 10, 11, 14
mw_comment_version: 8

# Quick analysis mode (faster, skip deep function boundary analysis)
quick_analysis: false

# False pointers: pixel data in the rodata_80270008 texture block contains
# the word 0x803A3F3F three times, which falls inside game/movie.c's .bss
# (the loader thread object at 0x803A3E58). Keep it as data so the source
# TU does not have to define a label in the middle of an OSThread.
block_relocations:
  - target: .bss:0x803A3F3F
  # False pointers: psSetupTev (psdisptev.c) compares the particle's kind
  # against the constant masks 0x80100000/0x80100080/0x80100400/0x80100480,
  # built with lis/addi. Those values fall inside fn_800FF970, so analysis
  # turned the pairs into symbol references.
  - source: .text:0x8016EC24
  - source: .text:0x8016EC2C
  - source: .text:0x8016ECA4
  - source: .text:0x8016ECB4
  # False pointer: the bit-mask table lbl_80478948 (cardesavedata.c,
  # {0x80, 0x40, ..., 0x01}) reads as 0x80402010. That address is inside the
  # GSmsg TU's .bss (the print code buffer, a pooled static in
  # GSmsg_800F9D04.c), which has no global symbol there.
  - target: .bss:0x80402010
  # False pointer: pixel data in lbl_802C0CB0 (data_8027A500.c) contains the
  # word 0x803FFFFF, which falls inside SIBios.c's static Packet array
  # (0x803FFFB0), now a file static of dolphin/si/SI_range_800CF764.c.
  - target: .bss:0x803FFFFF
  # False pointers: the Shift-JIS to GS character tables sCardESjisToGs81 and
  # sCardESjisToGsE0 (cardesavedata_decode_80080310.c) contain u16 pairs that
  # read as main.dol addresses.
  - source: .rodata:0x8026AEE8
  - source: .rodata:0x8026B414
  - source: .rodata:0x8026CD64
  - source: .rodata:0x8026CD68
  - source: .rodata:0x8026CD6C
  - source: .rodata:0x8026CD70
  # False pointers: pixel data in memcard.c's sMemcardBanner and sMemcardIcon.
  - source: .rodata:0x802766A4
  - source: .rodata:0x80276948
  - source: .rodata:0x80276958
  - source: .rodata:0x80276B74
  - source: .rodata:0x80276B78
  - source: .rodata:0x80276BB4
  - source: .rodata:0x80276C28
  - source: .rodata:0x80276E34
  - source: .rodata:0x802790E8

