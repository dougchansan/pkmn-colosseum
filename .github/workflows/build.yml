name: Build

on:
  push:
  pull_request:

permissions:
  contents: write
  packages: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # This container and its original inputs must remain private.
    container: ghcr.io/dougchansan/pkmn-colosseum-build:main
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        version: [GC6E01]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Git config
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Prepare and verify private original inputs
      run: |
        mkdir -p orig
        cp -a /orig/. orig/
        python3 tools/ci_retail.py \
            --manifest config/${{ matrix.version }}/build.sha1 \
            --orig orig/${{ matrix.version }}

    # Do not cache build/: it contains objects extracted from original game
    # files, and public-repository caches can be read by fork pull requests.
    # Fresh builds also remove the need for git-restore-mtime, whose old
    # git-whatchanged invocation is incompatible with the current runner Git.
    - name: Build all source and report
      run: |
        python configure.py --map --version ${{ matrix.version }} \
            --binutils /binutils --compilers /compilers
        ninja -j2 all_source build/${{ matrix.version }}/report.json

    - name: Verify reconstructed interrupt-vector source
      run: |
        python3 tools/verify_interrupt_vector_source.py \
            --object build/${{ matrix.version }}/src/crt/interrupt_vectors.o \
            --orig orig/${{ matrix.version }}/sys/main.dol \
            --report build/${{ matrix.version }}/report.json \
            --output build/${{ matrix.version }}/interrupt_vector_validation.json

    - name: Link full retail outputs and verify canonical hashes
      run: |
        # A stalled legacy linker must fail with logs while report diagnostics
        # can still run. The last complete source-and-output build took 125s.
        timeout -s TERM -k 30 300 ninja -j2
        sha1sum -c config/${{ matrix.version }}/build.sha1
        python3 tools/ci_retail.py \
            --manifest config/${{ matrix.version }}/build.sha1 \
            --orig orig/${{ matrix.version }} --outputs

    - name: Explain remaining data comparisons
      if: always()
      run: |
        if test -f build/${{ matrix.version }}/report.json; then
          python3 tools/data_match_diagnostics.py \
              --report build/${{ matrix.version }}/report.json \
              --config objdiff.json --include-data-only \
              --include-unit main/musyx/runtime/seq \
              --include-unit main/musyx/runtime/hw_dspctrl \
              --include-unit main/hsd/dobj --include-unit main/hsd/wobj \
              --include-unit main/hsd/archive --include-unit main/hsd/class \
              --orig orig/${{ matrix.version }} \
              --output build/${{ matrix.version }}/data_match_diagnostics.json
        fi

    - name: Verify zero-data symbol layouts
      if: always()
      run: |
        if test -f build/${{ matrix.version }}/report.json; then
          python3 tools/verify_zero_data_layout.py \
              --build-dir build/${{ matrix.version }} \
              --output build/${{ matrix.version }}/zero_data_layout.json
        fi

    - name: Describe known unresolved small-data references
      if: always()
      run: |
        if test -f build/${{ matrix.version }}/report.json; then
          python3 tools/small_data_reference_diagnostics.py \
              --output build/${{ matrix.version }}/small_data_reference_diagnostics.json
        fi

    - name: Diagnose linked data addresses
      if: always()
      run: |
        if test -f build/${{ matrix.version }}/main.elf && test -f build/${{ matrix.version }}/report.json; then
          python3 tools/data_link_diagnostics.py \
              --elf build/${{ matrix.version }}/main.elf \
              --report build/${{ matrix.version }}/report.json \
              --symbols config/${{ matrix.version }}/symbols.txt \
              --array-aliases config/${{ matrix.version }}/data_aliases \
              --include-unit main/musyx/runtime/seq \
              --include-unit main/musyx/runtime/hw_dspctrl \
              --include-unit main/hsd/dobj --include-unit main/hsd/wobj \
              --include-unit main/hsd/archive \
              --output build/${{ matrix.version }}/data_link_diagnostics.json
        fi

    - name: Probe compiler data alignment with synthetic declarations
      if: always()
      run: |
        if test -f build/tools/wibo; then
          python3 tools/probe_mwcc_data_alignment.py \
              --compiler /compilers/GC/1.2.5n/mwcceppc.exe \
              --wrapper build/tools/wibo \
              --output build/${{ matrix.version }}/mwcc_data_alignment.json
        fi

    # Metadata and synthetic probes only: no original objects or payloads.
    - name: Upload data comparison diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_data_diagnostics
        path: |
          build/${{ matrix.version }}/data_match_diagnostics.json
          build/${{ matrix.version }}/zero_data_layout.json
          build/${{ matrix.version }}/data_link_diagnostics.json
          build/${{ matrix.version }}/mwcc_data_alignment.json
          build/${{ matrix.version }}/small_data_reference_diagnostics.json
          build/${{ matrix.version }}/interrupt_vector_validation.json
        if-no-files-found: ignore

    - name: Verify registered assembly branch targets
      run: |
        test -d build/${{ matrix.version }}/asm
        python3 .github/scripts/verify_asm_branch_targets.py \
            build/${{ matrix.version }}/asm
        python3 .github/scripts/asm_evidence_summary.py \
            build/${{ matrix.version }}/report.json

    - name: Require metric and topology integrity
      run: |
        python3 .github/scripts/check_metric_integrity.py \
            build/${{ matrix.version }}/report.json orig/${{ matrix.version }}/sys/main.dol
        python3 tools/check_object_map_freeze.py \
            --report build/${{ matrix.version }}/report.json --strict-source-status
        python3 tools/update_readme_progress.py \
            --report build/${{ matrix.version }}/report.json --check

    - name: Upload map
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_maps
        path: build/${{ matrix.version }}/**/*.MAP

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_report
        path: build/${{ matrix.version }}/report.json
        if-no-files-found: ignore

    # Chart history contains report measurements only, never original bytes.
    - name: Render progress chart
      if: matrix.version == 'GC6E01'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
        rm -rf /tmp/chart
        if ! git clone --quiet --depth 1 --branch progress-chart "$REMOTE" /tmp/chart; then
          echo "progress-chart branch missing; starting it"
          git clone --quiet --depth 1 "$REMOTE" /tmp/chart
          git -C /tmp/chart checkout --quiet --orphan progress-chart
          git -C /tmp/chart rm -rq --cached .
          find /tmp/chart -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
        fi
        uv run --with matplotlib tools/plot_progress.py \
            --append build/${{ matrix.version }}/report.json \
            --history /tmp/chart/progress_history.json \
            --write-history -o /tmp/chart/progress.png

    - name: Upload chart preview
      if: github.event_name == 'pull_request' && matrix.version == 'GC6E01'
      uses: actions/upload-artifact@v4
      with:
        name: progress_chart_preview
        path: /tmp/chart/progress.png
        if-no-files-found: ignore

    - name: Publish progress chart
      if: >-
        github.event_name == 'push'
        && github.ref == 'refs/heads/master'
        && matrix.version == 'GC6E01'
      run: |
        cd /tmp/chart
        git add progress.png progress_history.json
        if git diff --cached --quiet; then
          echo "progress unchanged; nothing to publish"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit --quiet -m "Update progress chart for ${GITHUB_SHA}"
        git push --quiet origin progress-chart
