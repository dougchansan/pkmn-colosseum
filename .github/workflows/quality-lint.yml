name: Quality Lint
# Blocks match-cheating patterns in newly added source. Authentic SDK hardware
# primitives and explicitly scoped paired-single math are the only asm classes.
# Scans only the PR's added lines.
on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Git config
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Test quality allowlists
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Test verified jump-table import
        run: python3 tools/test_import_jump_table_symbol.py
      - name: Scan added lines for asm-wrappers / .inc includes
        run: |
          python3 .github/scripts/quality_scan.py '${{ github.event.pull_request.base.sha }}' '${{ github.sha }}'
      # quality_scan.py only sees the PR diff, so it cannot catch a wrapper
      # re-activated by flipping `#if 0` to `#if 1` -- that adds no #include
      # line. This walks the whole tree instead.
      - name: Fail on any live .inc asm wrapper
        run: python3 .github/scripts/check_asm_wrappers.py src
